<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc">
<title id="title">省ける費用と必要になる費用から、選択肢を見直す</title>
<desc id="desc">調査・実装・修正でどこまで費用を省けるかと、検証・移行・維持にどの費用が必要かをそれぞれ見積もる。その結果を合わせ、変更の方法・範囲・優先順位を選び直す。生成費用だけで総費用の大小を決めない。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="15" width="490" height="85" rx="9"/><rect x="20" y="125" width="490" height="85" rx="9"/></g>
<g font-size="27" font-weight="700"><text x="265" y="49">調査・実装・修正</text><text x="265" y="159">検証・移行・維持</text></g>
<g font-size="24"><text x="265" y="83">どこまで費用を省けるか</text><text x="265" y="193">どんな費用が必要になるか</text></g>
<g fill="none" stroke="#666" stroke-width="2.5"><path d="M510 58 H565 V112 H635" marker-end="url(#a)"/><path d="M510 168 H565 V112"/></g>
<rect x="650" y="56" width="450" height="112" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="875" y="100" font-size="28" font-weight="700">変更の選択肢を見直す</text><text x="875" y="142" font-size="25">方法・範囲・優先順位</text>
<text x="560" y="239" font-size="24">作業ごとに費用を見積もり、変更後の負担まで比べる</text>
</g></svg>
