<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="285" viewBox="0 0 1120 285" role="img" aria-labelledby="title desc">
  <title id="title">情報・操作の制限・結果の検証を分ける</title>
  <desc id="desc">情報を受けたエージェントが操作を選ぶ。選んだ操作は権限と実行環境の制限を通って実行される。実行ログと検査結果を返し、修正するか、権限外の判断を戻すかを決める。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g stroke="#999" stroke-width="2"><rect x="10" y="29" width="245" height="126" rx="8" fill="#f5f5f5"/><rect x="300" y="29" width="235" height="126" rx="8" fill="#fff"/><rect x="580" y="29" width="240" height="126" rx="8" fill="#e0e0e0"/><rect x="865" y="29" width="245" height="126" rx="8" fill="#f5f5f5"/></g>
    <g font-size="26" font-weight="700"><text x="132" y="69">情報を渡す</text><text x="417" y="69">操作を選ぶ</text><text x="700" y="69">実行を制限する</text><text x="987" y="69">実行・検証する</text></g>
    <g font-size="22" fill="#555"><text x="132" y="106">目的・根拠・状態</text><text x="132" y="136">必要な資料を調べる</text><text x="417" y="106">エージェントが判断</text><text x="417" y="136">ツールへ要求</text><text x="700" y="106">権限・隔離した環境</text><text x="700" y="136">許可のない操作を拒否</text><text x="987" y="106">許可した範囲で実行</text><text x="987" y="136">検査結果・ログを残す</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M264 91 H290"/><path d="M544 91 H570"/><path d="M829 91 H855"/><path d="M987 167 V213 H417 V167"/></g>
    <rect x="505" y="193" width="402" height="38" fill="#fff"/><text x="706" y="220" font-size="22">結果を受けて修正・再試行する</text>
    <text x="560" y="268" font-size="23" fill="#555">条件を満たせない・範囲を超える場合は、記録とともに判断を戻す</text>
  </g>
</svg>
