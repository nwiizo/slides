<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
<title id="title">同じ変更について、価値・境界・担当を一緒に選ぶ</title>
<desc id="desc">利用者に必要な変化を、開発の優先順位、ソフトウェアの境界、実装から運用まで担うチームの三つから検討する。これらは一方向の工程ではなく、互いに制約を照合する関係。届いた結果で三つを見直す。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="280" y="12" width="560" height="55" rx="9" fill="#e0e0e0"/><text x="560" y="48" font-size="28" font-weight="700">利用者に、どんな変化を届けるか</text>
<path d="M175 104 V84 H945 V104 M560 67 V104" fill="none" stroke="#999" stroke-width="2"/>
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="110" width="310" height="100" rx="10"/><rect x="405" y="110" width="310" height="100" rx="10"/><rect x="790" y="110" width="310" height="100" rx="10"/></g>
<g font-size="28" font-weight="700"><text x="175" y="151">事業の判断</text><text x="560" y="151">ソフトウェアの境界</text><text x="945" y="151">チームの責任</text></g>
<g font-size="24"><text x="175" y="188">どの開発を優先するか</text><text x="560" y="188">何をまとめて変えるか</text><text x="945" y="188">誰が運用まで担うか</text></g>
<g fill="none" stroke="#666" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"><path d="M344 159 H391"/><path d="M729 159 H776"/></g>
<text x="560" y="261" font-size="24">優先順位・境界・担当を対応づけ、届いた結果で見直す</text>
</g></svg>
