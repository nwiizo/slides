<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">採用した実装と担当範囲から、構造・理由・評価をたどる</title>
<desc id="desc">担当範囲と採用した実装を中心に、構造と依存、判断理由と適用条件、仕様と生成条件、評価結果と運用での学びを結びつける。線は工程ではなく、相互にたどれる参照関係を表す。</desc>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<g fill="none" stroke="#666" stroke-width="2.5"><path d="M320 55 L420 115 M320 188 L420 135 M800 55 L700 115 M800 188 L700 135"/></g>
<rect x="420" y="75" width="280" height="100" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="560" y="115" font-size="27" font-weight="700">担当範囲と</text><text x="560" y="153" font-size="27" font-weight="700">採用した実装</text>
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="15" y="17" width="305" height="76" rx="9"/><rect x="15" y="150" width="305" height="76" rx="9"/><rect x="800" y="17" width="305" height="76" rx="9"/><rect x="800" y="150" width="305" height="76" rx="9"/></g>
<g font-size="25"><text x="167" y="63">構造と依存</text><text x="167" y="197">判断理由と適用条件</text><text x="952" y="63">仕様と生成条件</text><text x="952" y="197">評価結果と運用の学び</text></g>
<text x="560" y="231" font-size="23">同じ対象へ結びつける</text>
</g></svg>
