<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">実装・理解・意図が互いを支える</title>
  <desc id="desc">意図の記録、共有理解、実装の構造を双方向につなぎ、実装と判断理由の照合も示す。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="10" y="20" width="300" height="110" rx="8"/><rect x="410" y="20" width="300" height="110" rx="8"/><rect x="810" y="20" width="300" height="110" rx="8"/></g>
    <g font-size="30" font-weight="700"><text x="160" y="63">意図の記録</text><text x="560" y="63">共有理解</text><text x="960" y="63">実装の構造</text></g>
    <g font-size="23" fill="#555"><text x="160" y="102">目的・制約・判断理由</text><text x="560" y="102">影響を説明し、確かめ合う</text><text x="960" y="102">依存・境界・振る舞い</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M328 76 H392"/><path d="M728 76 H792"/><path d="M160 142 V194 H960 V142"/></g>
    <rect x="338" y="174" width="444" height="40" fill="#fff"/>
    <text x="560" y="203" font-size="24">実装と、残した判断理由を照合する</text>
  </g>
</svg>
