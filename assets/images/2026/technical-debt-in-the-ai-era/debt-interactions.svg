<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
<title id="title">すべての負債は、互いに影響する</title>
<desc id="desc">オニオンモデルの5層を通して、実装負債を含む技術的負債の背後にある条件をたどる。認知的負債と意図の負債は追加の層ではなく、どの層の判断にも関わる。双方向の矢印は相互の影響を表す。構造や仕事の進め方が理解と判断理由の引き継ぎに影響し、その不足が構造・優先順位・役割・費用の分担・守る条件を見直す判断を難しくする。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<text x="355" y="26" font-size="26" font-weight="700">技術的負債を、背後の条件へ掘り下げる</text>
<text x="957" y="26" font-size="24" font-weight="700">どの層の判断にも関わる</text>
<g stroke="#999" stroke-width="2">
<ellipse cx="355" cy="185" rx="340" ry="145" fill="#f5f5f5"/>
<ellipse cx="355" cy="210" rx="285" ry="120" fill="white"/>
<ellipse cx="355" cy="235" rx="225" ry="95" fill="#f5f5f5"/>
<ellipse cx="355" cy="260" rx="170" ry="70" fill="white"/>
<ellipse cx="355" cy="285" rx="110" ry="45" fill="#e0e0e0"/>
</g>
<g font-size="24" font-weight="700">
<text x="355" y="79">技術：実装負債・設計の問題</text>
<text x="355" y="129">トレードオフ：今と将来</text>
<text x="355" y="179">システム：役割・評価</text>
<text x="355" y="229">経済・ゲーム理論</text>
<text x="355" y="278">厄介な問題</text>
</g>
<text x="355" y="306" font-size="22">目的・解決の違い</text>
<g fill="none" stroke="#666" stroke-width="2.5">
<path d="M725 40 H750 V330 H725"/>
<path d="M750 123 H797" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M750 263 H797" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<g stroke="#999" stroke-width="2" fill="#f5f5f5">
<rect x="810" y="68" width="295" height="110" rx="10"/>
<rect x="810" y="208" width="295" height="110" rx="10"/>
</g>
<g font-size="27" font-weight="700">
<text x="957" y="103">認知的負債</text>
<text x="957" y="243">意図の負債</text>
</g>
<g font-size="22">
<text x="957" y="135">判断に必要な</text>
<text x="957" y="164">共有理解が足りない</text>
<text x="957" y="275">目的・制約・理由を</text>
<text x="957" y="304">記録から確かめられない</text>
</g>
<text x="560" y="360" font-size="22" fill="#555">5つの層は、負債が生まれ、残る条件を掘り下げる見方</text>
</g></svg>
