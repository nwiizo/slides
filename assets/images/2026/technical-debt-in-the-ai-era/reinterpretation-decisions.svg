<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
<title id="title">どこに負担があり、なぜ残るかを調べて対処する</title>
<desc id="desc">構造の問題や共有理解・判断理由の不足が増やす負担と、その問題が5層のどんな選択や条件から生じるかを区別して調べる。両方の問いから対処を組み合わせ、余分な作業と発生条件の変化を確かめる。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="15" y="15" width="550" height="95" rx="10"/><rect x="15" y="135" width="550" height="95" rx="10"/></g>
<g font-size="28" font-weight="700"><text x="290" y="53">何が余分な作業を増やすか</text><text x="290" y="173">なぜ生まれ、残るのか</text></g>
<text x="290" y="88" font-size="24">構造の問題・共有理解や判断理由の不足</text><text x="290" y="208" font-size="24">5層から、選択と仕事の進め方を調べる</text>
<g fill="none" stroke="#666" stroke-width="2.5"><path d="M565 63 H620 V120 H680" marker-end="url(#a)"/><path d="M565 183 H620 V120"/></g>
<rect x="695" y="45" width="410" height="154" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="900" y="87" font-size="28" font-weight="700">対処を組み合わせる</text><text x="900" y="132" font-size="25">構造・理解・記録の改善</text><text x="900" y="171" font-size="25">役割・評価・費用の分担の見直し</text>
<text x="560" y="261" font-size="24">余分な作業と、同じ負債を生む条件がどう変わったかを確かめる</text>
</g></svg>
