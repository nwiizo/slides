<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">候補を作り、評価し、利用の結果から設計を選び直す</title>
  <desc id="desc">目的と品質条件から、設計候補、実装と評価、採用と移行、運用での観測へ進む。評価に適合しない候補は修正する。運用で前提のずれが見つかれば、目的や条件の判断を見直す。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="10" y="28" width="186" height="113" rx="8"/><rect x="238" y="28" width="186" height="113" rx="8"/><rect x="466" y="28" width="186" height="113" rx="8"/><rect x="694" y="28" width="186" height="113" rx="8"/><rect x="922" y="28" width="186" height="113" rx="8"/></g>
    <g font-size="27" font-weight="700"><text x="103" y="72">目的と条件</text><text x="331" y="72">設計の候補</text><text x="559" y="72">実装・評価</text><text x="787" y="72">採用・移行</text><text x="1015" y="72">運用で観測</text></g>
    <g font-size="22" fill="#555"><text x="103" y="112">何を満たすか</text><text x="331" y="112">構造を選び直す</text><text x="559" y="112">不適合を修正</text><text x="787" y="112">比較して切り替え</text><text x="1015" y="112">実際の結果</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M202 84 H231"/><path d="M430 84 H459"/><path d="M658 84 H687"/><path d="M886 84 H915"/><path d="M559 153 V186 H331 V153"/><path d="M1015 153 V261 H103 V153"/></g>
    <text x="445" y="218" font-size="23">不適合なら、候補を修正する</text>
    <rect x="254" y="240" width="613" height="41" fill="#fff"/>
    <text x="560" y="270" font-size="24">前提のずれを確かめ、目的と条件の判断へ戻す</text>
  </g>
</svg>
