<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
<title id="title">生成した候補は、採否が決まるまで変更として届かない</title>
<desc id="desc">生成・修正から出た候補は、評価と判断を待つ。採用した候補だけが統合・運用へ進み、却下した候補は止まる。候補が判断できる数を上回り続けると待ちが積み上がる。候補の枚数や箱の幅は測定値ではない。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="15" y="60" width="240" height="87" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="135" y="112" font-size="28" font-weight="700">生成・修正</text>
<g fill="#e0e0e0" stroke="#999" stroke-width="2"><rect x="340" y="70" width="115" height="70" rx="6"/><rect x="355" y="59" width="115" height="70" rx="6"/><rect x="370" y="48" width="115" height="70" rx="6"/></g>
<text x="417" y="166" font-size="24">判断待ちの候補</text>
<rect x="570" y="60" width="230" height="87" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="685" y="112" font-size="27" font-weight="700">評価・採否判断</text>
<rect x="925" y="60" width="180" height="87" rx="9" fill="#e0e0e0" stroke="#999" stroke-width="2"/><text x="1015" y="112" font-size="27" font-weight="700">統合・運用</text>
<g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"><path d="M255 103 H327"/><path d="M487 103 H557"/><path d="M800 103 H912"/><path d="M685 147 V195"/></g>
<text x="861" y="86" font-size="23">採用</text><text x="685" y="226" font-size="24">却下・保留</text>
<text x="560" y="260" font-size="24">生成の時間と、利用者へ届くまでの時間を分けて見る</text>
</g></svg>
