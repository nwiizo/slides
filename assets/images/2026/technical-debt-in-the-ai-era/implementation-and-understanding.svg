<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="235" viewBox="0 0 1120 235" role="img" aria-labelledby="title desc">
<title id="title">実装の進行と、チームが理解を得る過程をつなぐ</title>
<desc id="desc">エージェントの生成・実行・修正から、コードと試行の記録が得られる。記録が揃うことと、チームが変更の影響を判断できることは同じではない。破線は自動で理解が揃わないことを表す。予測と結果を照合する過程をチームの仕事に組み込む。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="40" width="300" height="130" rx="10"/><rect x="400" y="40" width="300" height="130" rx="10"/></g>
<rect x="845" y="40" width="255" height="130" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<g font-size="27" font-weight="700"><text x="170" y="84">生成・実行・修正</text><text x="550" y="84">コードと試行の記録</text><text x="972" y="84">チームの理解</text></g>
<g font-size="23"><text x="170" y="128">エージェントが進める</text><text x="550" y="128">結果と経緯を受け取る</text><text x="972" y="128">影響を判断できる</text></g>
<path d="M320 105 H387" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M700 105 H832" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="770" y="28" font-size="22" fill="#555">自動では揃わない</text>
<text x="560" y="222" font-size="24">予測と結果を照合する過程を、チームの仕事として組み込む</text>
</g></svg>
