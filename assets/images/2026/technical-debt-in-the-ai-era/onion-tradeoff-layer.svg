<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc">
<title id="title">今得られるものと、引き受ける将来の負担を比べる</title>
<desc id="desc">限られた時間と情報のもとで、早く届け、早く確かめられることと、将来の変更・検証・維持の負担を比べる。当時選べた手段と見積もれた負担から、その選択を捉える。面積や距離は費用の大小を表さない。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="20" y="14" width="1080" height="43" rx="8" fill="#f5f5f5"/>
<text x="560" y="44" font-size="25">選択を制約する、時間と情報</text>
<rect x="400" y="82" width="320" height="100" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="560" y="122" font-size="28" font-weight="700">何を優先して選ぶか</text><text x="560" y="159" font-size="24">選べる手段と費用を比べる</text>
<g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"><path d="M400 130 H335"/><path d="M720 130 H785"/></g>
<text x="175" y="117" font-size="28" font-weight="700">今得られるもの</text><text x="175" y="157" font-size="24">早く届け、早く確かめる</text>
<text x="950" y="117" font-size="28" font-weight="700">将来の負担</text><text x="950" y="157" font-size="24">変更・検証・維持が増える</text>
<text x="560" y="228" font-size="24">当時選べた手段と、見積もれた負担から、その選択を捉える</text>
</g></svg>
