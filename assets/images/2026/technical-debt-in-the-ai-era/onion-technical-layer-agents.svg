<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc">
<title id="title">修正・調査・試作を、構造の見直しに使う</title>
<desc id="desc">エージェントに支援してもらう作業と、見直したい構造を対応づける。コードの修正は内部の問題へ、依存の調査と設計案の試作は責務・依存の境界へ働きかける。作業量ではなく、必要な変更の修正・検証・調整の負担で効果を確かめる。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<text x="245" y="31" font-size="25" font-weight="700">エージェントの支援を受ける作業</text><text x="830" y="31" font-size="25" font-weight="700">見直す対象</text>
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="50" width="450" height="62" rx="8"/><rect x="20" y="137" width="450" height="62" rx="8"/></g>
<g fill="#e0e0e0" stroke="#999" stroke-width="2"><rect x="570" y="50" width="530" height="62" rx="8"/><rect x="570" y="137" width="530" height="62" rx="8"/></g>
<g font-size="27"><text x="245" y="90">コードの修正</text><text x="245" y="177">依存の調査・設計案の試作</text><text x="835" y="90">コード内部の問題</text><text x="835" y="177">責務と依存の境界</text></g>
<g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"><path d="M470 81 H557"/><path d="M470 168 H557"/></g>
<text x="560" y="235" font-size="24">必要な変更の、修正・検証・調整の負担がどう変わったかを確かめる</text>
</g></svg>
