<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">設計の方針と変更した実装を照合し、修正後に確かめ直す</title>
<desc id="desc">設計の方針から定めた検査条件を、変更した実装へ適用する。不合格なら実装を修正して再検査する。合格結果は、他の評価結果と合わせて採否を判断する材料になる。合格させるためだけに方針を変える流れではない。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="25" y="15" width="325" height="70" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="187" y="58" font-size="26" font-weight="700">設計の方針・検査条件</text>
<rect x="25" y="123" width="325" height="70" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="187" y="166" font-size="27" font-weight="700">変更した実装</text>
<rect x="485" y="69" width="220" height="76" rx="9" fill="#e0e0e0" stroke="#999" stroke-width="2"/><text x="595" y="116" font-size="28" font-weight="700">検査する</text>
<g fill="none" stroke="#666" stroke-width="2.5"><path d="M350 50 H405 V105 H472" marker-end="url(#a)"/><path d="M350 158 H405 V105"/><path d="M705 105 H820" marker-end="url(#a)"/><path d="M595 145 V220 H187 V193" marker-end="url(#a)"/></g>
<text x="763" y="87" font-size="23">合格</text><text x="970" y="92" font-size="27" font-weight="700">採否判断の材料</text><text x="970" y="133" font-size="23">他の評価と合わせる</text>
<text x="837" y="213" font-size="24">不合格 → 実装を修正 → 再検査</text>
</g></svg>
