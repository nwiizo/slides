<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">設計の方針を、変更のたびに働く検査へつなぐ</title>
  <desc id="desc">依存の境界を例に、構造と判断理由から検査条件を定め、コード・設定に違反がないかを各変更で調べる。結果を変更の採用判断に使う。方針自体を変える場合は理由を確かめ、検査も更新する。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="10" y="15" width="320" height="154" rx="8"/><rect x="795" y="15" width="315" height="154" rx="8"/></g>
    <rect x="405" y="15" width="315" height="154" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <g font-size="27" font-weight="700"><text x="170" y="54">設計方針と理由</text><text x="562" y="54">各変更で依存を検査</text><text x="952" y="54">変更の採用判断</text></g>
    <g font-size="24" fill="#555"><text x="170" y="95">C4の境界・ADRの理由</text><text x="170" y="134">例：許可する依存の方向</text><text x="562" y="95">コード・設定を調べる</text><text x="562" y="134">違反する参照を検出する</text><text x="952" y="95">違反があれば修正へ戻す</text><text x="952" y="134">他の評価と合わせて判断</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M342 91 H393"/><path d="M732 91 H783"/><path d="M952 181 V214 H170 V181"/></g>
    <rect x="280" y="193" width="560" height="39" fill="#fff"/>
    <text x="560" y="222" font-size="24">方針を変える場合は、理由と検査も更新する</text>
  </g>
</svg>
