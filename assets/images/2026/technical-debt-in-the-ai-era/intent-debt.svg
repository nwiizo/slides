<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">Intent Debt：実装が残っていても、判断の根拠を使えない</title>
  <desc id="desc">現在のコードや設定から何をしているかは確認できる。一方、目的・制約・判断理由の記録が欠けたり古くなったり矛盾すると、次に設計を維持するか変えるかを判断する根拠が不足する。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <rect x="10" y="13" width="335" height="86" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="177" y="49" font-size="27" font-weight="700">今のコード・設定</text>
    <text x="177" y="80" font-size="22" fill="#555">何をしているかは残っている</text>
    <rect x="10" y="130" width="335" height="97" rx="8" fill="#fff" stroke="#666" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="177" y="168" font-size="26" font-weight="700">目的・制約・判断理由</text>
    <text x="177" y="204" font-size="23" fill="#555">欠落・古い記録・矛盾</text>
    <rect x="720" y="33" width="390" height="177" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <text x="915" y="78" font-size="28" font-weight="700">次の設計判断</text>
    <text x="915" y="122" font-size="27">維持する？　変える？</text>
    <text x="915" y="171" font-size="24">判断の根拠が不足する</text>
    <path d="M358 56 H707" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="402" y="36" width="260" height="38" fill="#fff"/>
    <text x="532" y="63" font-size="23">現在の動作は見える</text>
    <path d="M358 179 H707" fill="none" stroke="#666" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <rect x="390" y="145" width="288" height="65" fill="#fff"/>
    <text x="534" y="168" font-size="24">なぜ、何を優先したか</text>
    <text x="534" y="201" font-size="24" font-weight="700">後から使える形にない</text>
  </g>
</svg>
