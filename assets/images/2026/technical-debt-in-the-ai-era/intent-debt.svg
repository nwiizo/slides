<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
<title id="title">現在の動作は分かっても、維持や変更の理由を使えない</title>
<desc id="desc">コード・設定から現在の動作は確認できる。一方、目的・制約・判断理由の記録が欠けたり古くなったりすると、変更を判断する根拠として使えない。下段の途切れた線はその不足を表す。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="20" y="20" width="435" height="75" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="237" y="66" font-size="27" font-weight="700">コード・設定 → 現在の動作</text>
<rect x="20" y="135" width="435" height="75" rx="9" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="237" y="181" font-size="27" font-weight="700">目的・制約・判断理由の記録</text>
<path d="M455 57 H700" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="580" y="43" font-size="23">確認できる</text>
<path d="M455 172 H550 M640 172 H700" stroke="#999" stroke-width="2.5" stroke-dasharray="6 6"/>
<text x="588" y="143" font-size="23">欠落・古さ・矛盾</text><text x="588" y="212" font-size="23">根拠が不足する</text>
<rect x="715" y="28" width="385" height="174" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="907" y="78" font-size="28" font-weight="700">次の変更の判断</text><text x="907" y="122" font-size="25">何を維持するか</text><text x="907" y="163" font-size="25">何を変えてよいか</text>
</g></svg>
