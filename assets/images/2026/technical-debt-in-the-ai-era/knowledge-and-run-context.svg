<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="265" viewBox="0 0 1120 265" role="img" aria-labelledby="title desc">
<title id="title">残しておく知識と現在の状態から、作業に必要な情報を選ぶ</title>
<desc id="desc">目的・設計・判断理由・評価を記録しておく。そこから選んだ知識に現在の状態と変更範囲を合わせ、作業中に参照するコンテキストにする。結果を確かめて記録を更新し、古い説明や不要な情報を整理する。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="15" y="72" width="350" height="107" rx="10" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="190" y="114" font-size="28" font-weight="700">残しておく知識</text><text x="190" y="152" font-size="23">目的・設計・判断理由・評価</text>
<rect x="453" y="95" width="330" height="84" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="618" y="131" font-size="27" font-weight="700">今回のコンテキスト</text><text x="618" y="162" font-size="23">必要な情報を選び直す</text>
<text x="618" y="36" font-size="25">現在の状態・変更範囲</text>
<rect x="870" y="95" width="235" height="84" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/><text x="987" y="145" font-size="27" font-weight="700">実行・結果の確認</text>
<g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"><path d="M365 133 H440"/><path d="M618 46 V82"/><path d="M783 133 H857"/><path d="M987 179 V221 H190 V179"/></g>
<text x="590" y="254" font-size="24">結果を確かめて記録を直し、古い説明や不要な情報を整理する</text>
</g></svg>
