<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">確かめて引き受けられる範囲から、自律性を決める</title>
  <desc id="desc">タスクの影響、観測と評価、停止と復旧を確かめ、任せる範囲を決める。その範囲内で進め、不明な影響や評価の不足があれば判断へ戻す。必要な手段を整えたうえで範囲を見直す。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <rect x="10" y="10" width="350" height="192" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="185" y="49" font-size="27" font-weight="700">タスクごとに確かめる</text>
    <g font-size="24"><text x="185" y="91">影響を閉じ込められるか</text><text x="185" y="132">結果を観測・評価できるか</text><text x="185" y="173">停止・復旧できるか</text></g>
    <rect x="425" y="53" width="310" height="110" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <text x="580" y="98" font-size="28" font-weight="700">任せる範囲を定める</text><text x="580" y="139" font-size="23">操作・影響・戻す条件</text>
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="820" y="10" width="290" height="88" rx="8"/><rect x="820" y="134" width="290" height="88" rx="8"/></g>
    <g font-size="26" font-weight="700"><text x="965" y="46">条件内で進める</text><text x="965" y="170">範囲を超えたら戻す</text></g>
    <g font-size="22" fill="#555"><text x="965" y="81">決めた基準で実行・評価</text><text x="965" y="205">不明な影響・評価の不足</text></g>
    <path d="M747 108 H774 V54 M774 108 V178" fill="none" stroke="#666" stroke-width="2.5"/>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M372 108 H413"/><path d="M774 54 H808"/><path d="M774 178 H808"/><path d="M965 234 V253 H185 V214"/></g>
    <rect x="305" y="233" width="540" height="39" fill="#fff"/><text x="575" y="261" font-size="24">必要な手段を整え、任せる範囲を見直す</text>
  </g>
</svg>
