<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
<title id="title">生成と別に確かめた根拠から、採否を判断する</title>
<desc id="desc">関係者と確認した条件や実際の利用が評価基準の根拠になる。候補の動作をその基準へ照合し、結果を採否判断へ渡す。実装とテストが同じ推測に一致していることだけでは根拠にならない。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="260" y="10" width="600" height="59" rx="9" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="560" y="49" font-size="26" font-weight="700">関係者と確かめた条件・実際の利用</text>
<path d="M560 69 V110" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="360" y="119" width="400" height="75" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="560" y="165" font-size="27" font-weight="700">評価基準と動作を照合</text>
<text x="145" y="140" font-size="27" font-weight="700">候補の動作</text><text x="145" y="176" font-size="23">修正・置き換え</text>
<path d="M260 155 H347" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M760 155 H860" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
<text x="980" y="141" font-size="27" font-weight="700">採否の判断</text><text x="980" y="177" font-size="23">結果と残る不確実さ</text>
<text x="560" y="246" font-size="24">評価基準を変える場合は、候補に合うかではなく、変更理由を確かめる</text>
</g></svg>
