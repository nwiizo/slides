<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">一つの変更が、複数の性質へ同時に影響する</title>
  <desc id="desc">キャッシュの追加で応答が短くなる一方、権限情報の反映が遅れる可能性がある。性能だけで採用せず、情報の鮮度とアクセス制御も合わせて確かめる。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="10" y="76" width="255" height="108" rx="8"/><rect x="365" y="10" width="315" height="95" rx="8"/><rect x="365" y="155" width="315" height="95" rx="8"/></g>
    <rect x="825" y="54" width="285" height="152" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <g font-size="27" font-weight="700"><text x="137" y="122">キャッシュを追加</text><text x="522" y="48">応答時間</text><text x="522" y="193">権限情報の反映</text><text x="967" y="94">同時に確かめる</text></g>
    <g font-size="24" fill="#555"><text x="137" y="159">一つの変更</text><text x="522" y="84">短くなる可能性</text><text x="522" y="229">遅れる可能性</text><text x="967" y="138">性能・情報の鮮度</text><text x="967" y="178">アクセス制御</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5"><path d="M277 130 H310 V57 M310 130 V202"/><path d="M692 57 H750 V202 H692"/></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M310 57 H353"/><path d="M310 202 H353"/><path d="M750 130 H813"/></g>
  </g>
</svg>
