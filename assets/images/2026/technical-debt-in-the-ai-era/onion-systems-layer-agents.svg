<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc">
<title id="title">実装の進捗から、採用後の結果まで評価する</title>
<desc id="desc">エージェントによる生成・修正の進捗だけでなく、採用の根拠、運用での結果と維持費を評価に含める。開発全体で得た結果から、目標、採用の権限、作業範囲を見直す。</desc>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="28" width="320" height="115" rx="10"/><rect x="400" y="28" width="320" height="115" rx="10"/><rect x="780" y="28" width="320" height="115" rx="10"/></g>
<g font-size="27" font-weight="700"><text x="180" y="73">生成・修正</text><text x="560" y="73">検証・採用</text><text x="940" y="73">統合・運用</text></g>
<g font-size="24"><text x="180" y="114">実装はどこまで進んだか</text><text x="560" y="114">何を根拠に採用したか</text><text x="940" y="114">何が届き、負担が残ったか</text></g>
<path d="M180 157 V178 H940 V157 M560 178 V197" fill="none" stroke="#666" stroke-width="2.5"/>
<rect x="140" y="197" width="840" height="42" rx="8" fill="#e0e0e0"/>
<text x="560" y="226" font-size="24">全体の結果を確かめ、目標・権限・作業範囲を見直す</text>
</g></svg>
