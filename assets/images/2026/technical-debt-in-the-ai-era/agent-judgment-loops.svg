<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">実装の反復を、目的から運用までの仕事に置く</title>
<desc id="desc">チームが自動実行と採用の条件を決める開発全体の内側に、エージェントによる生成・実行・修正の反復がある。採用した結果を運用で確かめ、目的と範囲、採用条件を見直す。エージェントは各工程を支援できる。チームは実行を確認・変更・停止する手段を保つ。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="10" y="8" width="1100" height="232" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="560" y="42" font-size="27" font-weight="700">チームが、実行・採用の条件と、変更・停止の手段を整える</text>
<text x="160" y="110" font-size="27" font-weight="700">目的・範囲</text><text x="160" y="146" font-size="23">何を変えるか</text>
<rect x="360" y="66" width="400" height="107" rx="9" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
<text x="560" y="100" font-size="26" font-weight="700">決めた範囲での自動実行</text><text x="560" y="136" font-size="25">生成 → 実行 → 修正</text>
<text x="958" y="110" font-size="27" font-weight="700">検証・採用・運用</text><text x="958" y="146" font-size="23">根拠と実際の結果</text>
<g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"><path d="M270 121 H347"/><path d="M760 121 H823"/><path d="M680 144 V157 H440 V144"/><path d="M958 166 V192 H160 V166"/></g>
<text x="560" y="226" font-size="24">運用の結果から、目的・範囲・採用条件を見直す</text>
</g></svg>
