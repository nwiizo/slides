<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">Technical Debt：内部の構造が、将来の変更を重くする</title>
  <desc id="desc">一つの変更が、内部の依存や制約を通して複数の箇所へ波及し、必要な修正と検証の範囲を広げる模式図。依存が存在すること自体を負債とは扱わない。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <rect x="10" y="66" width="228" height="104" rx="8" fill="#fff" stroke="#999" stroke-width="2"/>
    <text x="124" y="109" font-size="28" font-weight="700">一つの変更</text>
    <text x="124" y="145" font-size="23" fill="#555">変えたい動作がある</text>
    <rect x="318" y="8" width="480" height="222" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="558" y="45" font-size="26" font-weight="700">変更を妨げる内部の依存・制約</text>
    <g fill="#fff" stroke="#999" stroke-width="2"><rect x="342" y="86" width="155" height="66" rx="6"/><rect x="628" y="66" width="145" height="58" rx="6"/><rect x="628" y="149" width="145" height="58" rx="6"/></g>
    <text x="419" y="127" font-size="25">変更箇所</text>
    <g font-size="24"><text x="700" y="104">関連箇所A</text><text x="700" y="187">関連箇所B</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M248 119 H305"/><path d="M507 119 H566 V95 H615"/><path d="M566 119 V178 H615"/><path d="M810 119 H872"/></g>
    <text x="558" y="213" font-size="22" fill="#555">変更が波及</text>
    <rect x="884" y="52" width="226" height="132" rx="8" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    <text x="997" y="93" font-size="22" font-weight="700">修正・検証が増える</text>
    <text x="997" y="131" font-size="23">変更の費用が上がる</text>
    <text x="997" y="165" font-size="21" fill="#555">変更を断念することも</text>
  </g>
</svg>
