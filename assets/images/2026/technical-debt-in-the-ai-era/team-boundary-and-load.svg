<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="265" viewBox="0 0 1120 265" role="img" aria-labelledby="title desc">
<title id="title">判断から運用までを担える範囲へ、境界を合わせる</title>
<desc id="desc">チームが判断から運用まで担う範囲の中で、内部で決めることと、他のチームへ相談することを区別する。外との必要な依存を残し、互いの目的・制約を共有しながら、知識と調整の負荷から担当範囲を見直す。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="15" y="20" width="760" height="193" rx="12" fill="#f5f5f5" stroke="#666" stroke-width="2.5"/>
<text x="395" y="59" font-size="28" font-weight="700">チームが、意味と変更理由を共有する範囲</text>
<rect x="40" y="93" width="710" height="68" rx="8" fill="#e0e0e0"/>
<text x="395" y="136" font-size="28">判断 → 実装 → 検証 → 運用</text>
<text x="395" y="193" font-size="24">内部で決めること・外へ相談すること</text>
<g fill="none" stroke="#666" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"><path d="M789 126 H891"/></g>
<rect x="905" y="70" width="195" height="111" rx="9" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
<text x="1002" y="112" font-size="26" font-weight="700">他のチーム</text><text x="1002" y="150" font-size="25">共通機能</text>
<text x="841" y="61" font-size="22">必要な依存</text>
<text x="560" y="254" font-size="24">目的・制約を共有し、知識と調整の負荷から担当範囲を見直す</text>
</g></svg>
