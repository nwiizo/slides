<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
  <title id="title">維持する知識から、今回の判断に必要な情報を選ぶ</title>
  <desc id="desc">判断理由・構造・評価を維持し、今回の目的と変更対象に必要な情報を選ぶ。エージェントは不足する根拠を参照先から調べ、確認した新しい条件を知識へ戻す。次の作業へは進捗と未決事項も引き継ぐ。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <g stroke="#999" stroke-width="2"><rect x="10" y="24" width="310" height="130" rx="8" fill="#f5f5f5"/><rect x="403" y="24" width="305" height="130" rx="8" fill="#e0e0e0"/><rect x="790" y="24" width="320" height="130" rx="8" fill="#f5f5f5"/></g>
    <g font-size="27" font-weight="700"><text x="165" y="65">維持する知識</text><text x="555" y="65">今回の目的・変更対象</text><text x="950" y="65">調べ、実行し、確かめる</text></g>
    <g font-size="23" fill="#555"><text x="165" y="103">判断理由・構造・評価</text><text x="165" y="137">適用条件と参照先</text><text x="555" y="103">必要な条件だけを選ぶ</text><text x="555" y="137">進捗・未決事項も渡す</text><text x="950" y="103">不足は参照先へ戻る</text><text x="950" y="137">事実と推測を分ける</text></g>
    <g fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#arrow)"><path d="M332 89 H390"/><path d="M720 89 H777"/><path d="M950 167 V223 H165 V167"/></g>
    <rect x="345" y="202" width="433" height="40" fill="#fff"/><text x="562" y="231" font-size="24">確かめた条件を、次に使う知識へ</text>
  </g>
</svg>
