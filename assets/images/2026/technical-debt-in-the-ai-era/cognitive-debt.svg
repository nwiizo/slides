<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
<title id="title">実装の依存と、変更の影響を判断できる範囲のずれ</title>
<desc id="desc">実装にある依存と、チームが変更の影響を予測して確かめられる依存を比較する。実線は影響を判断できる関係、破線は影響を判断できない関係を表す模式図。ずれが残ると、再調査や特定の人を待つ負担が生じる。</desc>
<g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
<rect x="15" y="15" width="340" height="173" rx="10" fill="#f5f5f5"/><rect x="375" y="15" width="340" height="173" rx="10" fill="#f5f5f5"/>
<g font-size="26" font-weight="700"><text x="185" y="53">実装にある依存</text><text x="545" y="53">影響を判断できる範囲</text></g>
<g fill="none" stroke="#666" stroke-width="3"><path d="M90 95 L180 145 L280 95 M90 95 H280"/><path d="M450 95 L540 145"/><path d="M450 95 H640 L540 145" stroke-dasharray="7 7"/></g>
<g fill="#e0e0e0" stroke="#666" stroke-width="2"><circle cx="90" cy="95" r="14"/><circle cx="180" cy="145" r="14"/><circle cx="280" cy="95" r="14"/><circle cx="450" cy="95" r="14"/><circle cx="540" cy="145" r="14"/><circle cx="640" cy="95" r="14"/></g>
<path d="M752 39 V180" stroke="#999" stroke-width="2"/>
<text x="935" y="72" font-size="27" font-weight="700">影響を判断するたびに</text><text x="935" y="118" font-size="25">根拠を調べ直す</text><text x="935" y="159" font-size="25">判断できる人を待つ</text>
<path d="M130 216 H180" stroke="#666" stroke-width="3"/><text x="335" y="224" font-size="23">影響を判断できる関係</text><path d="M575 216 H625" stroke="#666" stroke-width="3" stroke-dasharray="7 7"/><text x="810" y="224" font-size="23">影響を判断できない関係</text>
</g></svg>
