<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">実装を替えても残す条件</title>
  <desc id="desc">変更理由、入出力の境界、受け入れ評価、採用した版の記録を残し、内側の実装Aを実装Bへ差し替える。</desc>
  <rect x="4" y="4" width="1112" height="290" rx="10" fill="#f5f5f5" stroke="#9a9a9a" stroke-width="2"/>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle">
    <text x="560" y="57" font-size="30" font-weight="700">残すもの</text>
    <text x="560" y="103" font-size="28">変更理由 ／ 入出力の境界 ／ 受け入れ評価 ／ 採用した版の記録</text>
    <rect x="180" y="150" width="300" height="96" rx="6" fill="#fff" stroke="#999" stroke-width="2"/>
    <rect x="640" y="150" width="300" height="96" rx="6" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="330" y="209" font-size="34">実装A</text>
    <text x="790" y="209" font-size="34">実装B</text>
    <path d="M500 198 H616 M603 186 L616 198 L603 210" fill="none" stroke="#555" stroke-width="3"/>
    <text x="560" y="276" font-size="24" fill="#555">条件を保って差し替える</text>
  </g>
</svg>
