<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="246" viewBox="0 0 1120 246" role="img" aria-labelledby="title desc">
  <title id="title">AIの解釈を候補として扱い、確かめた困りごとを直す</title>
  <desc id="desc">わかりにくいという指摘について、AIが結論の不足と比較の根拠の不足という候補を出す。必要な点を相手に確かめてから修正し、その結果で困りごとが解けたかを相手へ戻って確認する。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <rect x="4" y="38" width="220" height="108" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="114" y="82" font-weight="700">「わかりにくい」</text><text x="114" y="119" font-size="24">受け取った指摘</text>
    <path d="M238 92 H282 M270 80 L282 92 L270 104" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="296" y="8" width="322" height="168" rx="8" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="457" y="45" font-weight="700">AIが出す解釈の候補</text>
    <text x="457" y="88">結論が見えない？</text><text x="457" y="126">比較の根拠が足りない？</text>
    <text x="457" y="159" font-size="23" fill="#555">まだ相手の意図とは限らない</text>
    <path d="M632 92 H674 M662 80 L674 92 L662 104" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="688" y="38" width="220" height="108" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="798" y="82" font-weight="700">必要な点を聞く</text><text x="798" y="119" font-size="24">直す所を確かめる</text>
    <path d="M922 92 H956 M944 80 L956 92 L944 104" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="970" y="38" width="146" height="108" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="1043" y="100" font-weight="700">直す</text>
    <path d="M1043 146 V211 H114 V158 M102 170 L114 158 L126 170" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="335" y="191" width="520" height="40" fill="#fff"/>
    <text x="595" y="219" font-size="25">結果を戻し、困りごとが解けたかを見る</text>
  </g>
</svg>
