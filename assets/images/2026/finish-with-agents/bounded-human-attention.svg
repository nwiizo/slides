<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">任せた範囲で終え、条件を変える判断には材料を戻す</title>
  <desc id="desc">任せた範囲で条件を満たし、根拠が揃う仕事は完了の判定までエージェントへ任せる。条件や優先順位の変更が必要なときは人へ理由と比較材料を戻す。人が見る部分には時間と権限も必要で、前提と結果を辿り、任せ方を変え、実行を止められるようにする。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="25">
    <rect x="4" y="67" width="230" height="90" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="119" y="105" font-weight="700">エージェントの</text><text x="119" y="137" font-weight="700">作業・確認結果</text>
    <path d="M234 112 H274 V47 H680 M668 35 L680 47 L668 59 M274 112 V164 H680 M668 152 L680 164 L668 176" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="309" y="17" width="354" height="56" fill="#fff"/>
    <text x="486" y="38" font-size="24">任せた範囲で条件を満たし、</text><text x="486" y="68" font-size="24">確かめた根拠が揃う</text>
    <rect x="309" y="132" width="354" height="60" fill="#fff"/>
    <text x="486" y="153" font-size="24">条件や優先順位の変更が必要</text><text x="486" y="183" font-size="24">理由と比較する材料を戻す</text>
    <rect x="694" y="8" width="422" height="78" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="905" y="41" font-size="28" font-weight="700">完了まで任せる</text><text x="905" y="73" font-size="24">成果と根拠を残して渡す</text>
    <rect x="694" y="125" width="422" height="78" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="905" y="158" font-size="28" font-weight="700">人が必要な判断をする</text><text x="905" y="190" font-size="24">材料・時間・変更する権限を揃える</text>
    <path d="M905 203 V223 H119 V169 M107 181 L119 169 L131 181" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="360" y="207" width="298" height="32" fill="#fff"/>
    <text x="509" y="229" font-size="23">見直した条件で進める</text>
    <text x="560" y="273" font-size="24">前提と結果を辿れる ／ 目的や任せ方を変えられる ／ 実行を止められる</text>
  </g>
</svg>
