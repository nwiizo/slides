<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">目的と守る条件の中で、途中の判断を任せる</title>
  <desc id="desc">集計のずれの修正を例に、原因調査、修正、確認方法の選定を任せる。集計条件を変える必要が出た場合は、理由と選択肢を相談へ戻す。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <rect x="4" y="4" width="756" height="164" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="382" y="40" font-size="28" font-weight="700">目標：ずれを直す ／ 守る条件：集計の意味を保つ</text>
    <rect x="28" y="66" width="214" height="76" rx="6" fill="#fff" stroke="#aaa" stroke-width="2"/>
    <rect x="275" y="66" width="214" height="76" rx="6" fill="#fff" stroke="#aaa" stroke-width="2"/>
    <rect x="522" y="66" width="214" height="76" rx="6" fill="#fff" stroke="#aaa" stroke-width="2"/>
    <text x="135" y="112">原因を調べる</text><text x="382" y="112">直し方を選ぶ</text><text x="629" y="112">確認して直す</text>
    <path d="M248 104 H268 M258 94 L268 104 L258 114 M495 104 H515 M505 94 L515 104 L505 114" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="860" y="66" width="256" height="102" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="988" y="106" font-weight="700">相談へ戻す</text><text x="988" y="143">理由と選択肢</text>
    <path d="M382 168 V204 H988 V181 M976 193 L988 181 L1000 193" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="452" y="184" width="344" height="40" fill="#fff"/>
    <text x="624" y="213" font-size="24">集計条件の変更が必要なら</text>
  </g>
</svg>
