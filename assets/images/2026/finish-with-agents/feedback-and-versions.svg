<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">渡した版の結果を受け取って、次の修正を選ぶ</title>
  <desc id="desc">版Aを渡し、その版への評価を待ち、結果Aをもとに版Bを作る順序を示す。待つ間には、その結果に依存しない別の仕事を進められる。時間の長さを表す実測図ではない。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <rect x="4" y="18" width="235" height="102" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="298" y="18" width="235" height="102" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="592" y="18" width="235" height="102" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <rect x="886" y="18" width="230" height="102" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="121" y="58" font-size="29" font-weight="700">版Aを渡す</text><text x="121" y="96">対象の版を固定</text>
    <text x="415" y="58" font-size="29" font-weight="700">評価を待つ</text><text x="415" y="96">CI・相手の反応</text>
    <text x="709" y="58" font-size="29" font-weight="700">結果Aを読む</text><text x="709" y="96">版Aと結びつける</text>
    <text x="1001" y="58" font-size="29" font-weight="700">版Bを作る</text><text x="1001" y="96">結果から修正する</text>
    <path d="M249 69 H282 M270 57 L282 69 L270 81 M543 69 H576 M564 57 L576 69 L564 81 M837 69 H870 M858 57 L870 69 L858 81" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="298" y="162" width="529" height="56" rx="7" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="562" y="199">待つ間は、結果に依存しない別の仕事へ</text>
    <path d="M415 120 V147 M403 135 L415 147 L427 135" fill="none" stroke="#999" stroke-width="2.5"/>
  </g>
</svg>
