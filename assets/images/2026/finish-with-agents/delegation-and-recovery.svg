<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">誤りを見つけて対処できる範囲から任せる</title>
  <desc id="desc">任せる仕事について、誤りの検出、復旧、影響先を確認する。条件が不足する場合は先に確認方法や戻し方を調べ、揃った範囲で作業と確認を任せる。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <rect x="4" y="20" width="322" height="104" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="399" y="20" width="322" height="104" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="794" y="20" width="322" height="104" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="165" y="61" font-weight="700">見つけられるか</text><text x="165" y="100">何を、いつ確かめるか</text>
    <text x="560" y="61" font-weight="700">戻せるか</text><text x="560" y="100">失敗した変更・データ</text>
    <text x="955" y="61" font-weight="700">誰に届くか</text><text x="955" y="100">確認前に及ぶ影響</text>
    <path d="M165 124 V146 H955 V124 M560 124 V146 M246 146 V172 M234 160 L246 172 L258 160" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="4" y="180" width="484" height="68" rx="8" fill="#fff" stroke="#999" stroke-width="2"/>
    <rect x="632" y="180" width="484" height="68" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="246" y="208" font-size="24">不足があれば、先に整える</text><text x="246" y="237" font-size="24">確認方法・戻し方・影響の分離</text>
    <text x="874" y="222" font-weight="700">揃った範囲で、作業と確認を任せる</text>
    <path d="M504 214 H616 M604 202 L616 214 L604 226" fill="none" stroke="#666" stroke-width="2.5"/>
  </g>
</svg>
