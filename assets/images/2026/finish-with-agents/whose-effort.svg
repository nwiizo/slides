<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">同じ案でも、見る相手によって評価が変わる</title>
  <desc id="desc">一つの案から、作る人の作成と確認、使う人の操作と問い合わせという二つの負担を追う。どちらを減らし何を引き受けるかを決めて比較する。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <rect x="4" y="56" width="205" height="106" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="106" y="101" font-size="30" font-weight="700">一つの案</text><text x="106" y="140">負担を追う</text>
    <rect x="320" y="8" width="796" height="84" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="320" y="126" width="796" height="84" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="439" y="42" font-weight="700">作る人</text><text x="439" y="77" font-size="24">作成時の負担</text>
    <text x="731" y="42">作る・確かめる時間</text><text x="731" y="77" font-size="24">既存の仕組みを使えるか</text>
    <text x="439" y="160" font-weight="700">使う人</text><text x="439" y="195" font-size="24">利用のたびの負担</text>
    <text x="758" y="160">操作・調べ直し・問い合わせ</text><text x="758" y="195" font-size="24">誰が手順を覚え、誰が答えるか</text>
    <path d="M209 109 H260 V50 H304 M292 38 L304 50 L292 62 M260 109 V168 H304 M292 156 L304 168 L292 180" fill="none" stroke="#666" stroke-width="2.5"/>
    <path d="M566 22 V78 M566 140 V196" stroke="#aaa" stroke-width="2"/>
  </g>
</svg>
