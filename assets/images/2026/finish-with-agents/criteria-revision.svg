<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">新しい事実から、終了条件を共有し直す</title>
  <desc id="desc">終了条件Aで進めた結果と新しい事実を受け、目的に照らして条件Bを相談する。変えた理由と影響を、その条件で動く人とAIへ共有する。未達を隠すために確認を消すこととは区別する。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="25">
    <rect x="4" y="20" width="224" height="120" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="295" y="20" width="224" height="120" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="586" y="20" width="240" height="120" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <rect x="893" y="20" width="223" height="120" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="116" y="63" font-size="29" font-weight="700">終了条件A</text><text x="116" y="107">まず仮に置く</text>
    <text x="407" y="63" font-weight="700">結果と新しい事実</text><text x="407" y="107">何が足りないか</text>
    <text x="706" y="63" font-weight="700">条件Bを相談</text><text x="706" y="107">目的を満たせるか</text>
    <text x="1004" y="63" font-weight="700">人とAIへ共有</text><text x="1004" y="107">変更の理由と影響</text>
    <path d="M244 80 H279 M267 68 L279 80 L267 92 M535 80 H570 M558 68 L570 80 L558 92 M842 80 H877 M865 68 L877 80 L865 92" fill="none" stroke="#666" stroke-width="2.5"/>
    <path d="M407 152 V184 H1004 V152 M992 164 L1004 152 L1016 164" fill="none" stroke="#999" stroke-width="2.5"/>
    <rect x="460" y="165" width="487" height="44" fill="#fff"/>
    <text x="704" y="194">以前の条件で進む仕事にも知らせる</text>
  </g>
</svg>
