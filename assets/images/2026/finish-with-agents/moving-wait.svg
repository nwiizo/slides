<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="256" viewBox="0 0 1120 256" role="img" aria-labelledby="title desc">
  <title id="title">待ちを減らしたあとも、次に止まる場所を観測する</title>
  <desc id="desc">確認待ちがある仕事では、差分の大きさや根拠の探しにくさなど、その場所で待つ理由を改善する。改善後に判断待ちが見えたなら、その理由を調べて次の改善を選ぶ。図は順序の例で、待ち時間の測定値ではない。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <text x="108" y="60" font-size="24">いま見える待ち</text>
    <rect x="232" y="20" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="468" y="20" width="172" height="68" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <rect x="706" y="20" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="944" y="20" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="318" y="63">作る</text><text x="554" y="63" font-weight="700">確認待ち</text><text x="792" y="63">判断</text><text x="1030" y="63">利用</text>
    <path d="M416 54 H456 M444 42 L456 54 L444 66 M652 54 H694 M682 42 L694 54 L682 66 M890 54 H932 M920 42 L932 54 L920 66" fill="none" stroke="#666" stroke-width="2.5"/>
    <text x="672" y="126" font-size="24">確認を待つ理由を調べて変え、届くまでの時間を見る</text>
    <text x="108" y="178" font-size="24">その後も観測</text><text x="108" y="208" font-size="23">別の待ちがあれば</text>
    <rect x="232" y="150" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="468" y="150" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="706" y="150" width="172" height="68" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <rect x="944" y="150" width="172" height="68" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="318" y="193">作る</text><text x="554" y="193">確認</text><text x="792" y="193" font-weight="700">判断待ち</text><text x="1030" y="193">利用</text>
    <path d="M416 184 H456 M444 172 L456 184 L444 196 M652 184 H694 M682 172 L694 184 L682 196 M890 184 H932 M920 172 L932 184 L920 196" fill="none" stroke="#666" stroke-width="2.5"/>
    <text x="672" y="250" font-size="24">次に直す場所を、前回の思い込みで固定しない</text>
  </g>
</svg>
