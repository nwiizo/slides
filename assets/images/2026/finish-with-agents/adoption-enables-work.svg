<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
  <title id="title">選んだ案と理由が、受け手の次の仕事の前提になる</title>
  <desc id="desc">条件を満たす複数の案から、共有した優先順位で一案を採用する。採用した版と理由を渡すことで受け手が使い始められる。見送った案は、前提が変わったときの見直し材料として残す。</desc>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222" text-anchor="middle" font-size="26">
    <text x="145" y="31" font-size="24">条件を満たす複数の案</text>
    <rect x="4" y="50" width="80" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="105" y="50" width="80" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <rect x="206" y="50" width="80" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="44" y="101">A</text><text x="145" y="101">B</text><text x="246" y="101">C</text>
    <path d="M300 90 H432 M420 78 L432 90 L420 102" fill="none" stroke="#666" stroke-width="2.5"/>
    <text x="367" y="52" font-size="24">優先順位で</text>
    <rect x="446" y="50" width="288" height="80" rx="8" fill="#e0e0e0" stroke="#777" stroke-width="2"/>
    <text x="590" y="83" font-weight="700">今回はBを採用</text><text x="590" y="114" font-size="24">版と選んだ理由を共有</text>
    <path d="M748 90 H814 M802 78 L814 90 L802 102" fill="none" stroke="#666" stroke-width="2.5"/>
    <rect x="828" y="50" width="288" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="972" y="83" font-weight="700">受け手が使い始める</text><text x="972" y="114" font-size="24">次の作業の前提になる</text>
    <path d="M44 130 V176 H246 V130 M145 176 H434 M422 164 L434 176 L422 188" fill="none" stroke="#666" stroke-width="2.5"/>
    <text x="345" y="163" font-size="24">見送ったA・C</text>
    <rect x="446" y="150" width="670" height="66" rx="8" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="781" y="191" font-size="25">見送りの理由を残し、前提が変わったときに見直す</text>
  </g>
</svg>
