<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">課題名と締切を残して、最初の一つを見せる</title>
  <desc id="desc">最初の画面例では、授業Aのレポートと金曜18時の締切に、追加通知、カレンダー、達成記録が並ぶ。見直し例では課題名と締切を残し、最初の一つとして第3回資料を開くと書く。効果は未確認の案。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#666"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222">
    <g font-size="27" font-weight="700"><text x="20" y="31">最初の案（例）</text><text x="630" y="31">見直した案（例）</text></g>
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="20" y="49" width="470" height="236" rx="14"/><rect x="630" y="49" width="470" height="236" rx="14"/></g>
    <g font-size="30" font-weight="700"><text x="45" y="98">授業Aのレポート</text><text x="655" y="98">授業Aのレポート</text></g>
    <g font-size="27"><text x="45" y="145">締切：10/9（金）18:00</text><text x="655" y="145">締切：10/9（金）18:00</text></g>
    <g fill="white" stroke="#999" stroke-width="2"><rect x="45" y="192" width="130" height="60" rx="8"/><rect x="190" y="192" width="130" height="60" rx="8"/><rect x="335" y="192" width="130" height="60" rx="8"/></g>
    <g font-size="23" text-anchor="middle"><text x="110" y="230">追加通知</text><text x="255" y="230">カレンダー</text><text x="400" y="230">達成記録</text></g>
    <path d="M509 167H609" fill="none" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="655" y="174" width="420" height="94" rx="8" fill="#e0e0e0"/>
    <text x="675" y="207" font-size="23" fill="#555">最初の一つ</text>
    <text x="675" y="247" font-size="29" font-weight="700">第3回資料を開く</text>
  </g>
</svg>
