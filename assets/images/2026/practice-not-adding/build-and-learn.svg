<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">作る反復を、使う人から学ぶ反復へつなげる</title>
  <desc id="desc">何を変えたいかという見立てから試作する。作って手直しする小さな反復に加え、使う場面で確かめ、結果から見立てや案へ戻る大きな反復を描く。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#666" stroke-width="1.5"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" fill="#222">
    <rect x="22" y="70" width="280" height="124" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="162" y="113" font-size="28" font-weight="700" text-anchor="middle">見立てを持つ</text>
    <text x="162" y="155" font-size="24" text-anchor="middle">誰の何を変えたいか</text>
    <rect x="420" y="70" width="280" height="124" rx="12" fill="#e0e0e0" stroke="#666" stroke-width="2"/>
    <text x="560" y="113" font-size="28" font-weight="700" text-anchor="middle">試せる形にする</text>
    <text x="560" y="155" font-size="24" text-anchor="middle">作る・手直しする</text>
    <rect x="818" y="70" width="280" height="124" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <text x="958" y="113" font-size="28" font-weight="700" text-anchor="middle">使う場面で確かめる</text>
    <text x="958" y="155" font-size="24" text-anchor="middle">何が起きたかを見る</text>
    <path d="M302 130 H405" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M700 130 H803" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M620 70 V24 H500 V60" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="720" y="33" font-size="22" fill="#555">ここだけでは役立つか未確認</text>
    <path d="M958 194 V259 H162 V209" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="325" y="239" width="470" height="38" fill="white"/>
    <text x="560" y="266" font-size="25" text-anchor="middle">結果から、見立てや案を考え直す</text>
  </g>
</svg>
