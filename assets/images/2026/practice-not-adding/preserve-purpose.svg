<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">道具を替えても、同じ目的と条件で確かめる</title>
  <desc id="desc">今の道具と新しい道具の両方を、残す目的、守る条件、確かめ方に照らす。選んだ理由と前提を記録して、次の見直しに使う。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#666"/></marker></defs>
  <g font-family="Noto Sans JP, Hiragino Sans, sans-serif" text-anchor="middle" fill="#222">
    <rect x="200" y="10" width="720" height="80" rx="12" fill="#e0e0e0" stroke="#666" stroke-width="2"/>
    <text x="560" y="45" font-size="29" font-weight="700">残す目的・守る条件・確かめ方</text><text x="560" y="75" font-size="23" fill="#555">道具の外にも書いておく</text>
    <g fill="none" stroke="#666" stroke-width="3" marker-end="url(#arrow)"><path d="M350 95V133"/><path d="M770 95V133"/><path d="M465 183H649"/></g>
    <g fill="#f5f5f5" stroke="#999" stroke-width="2"><rect x="150" y="145" width="310" height="78" rx="12"/><rect x="660" y="145" width="310" height="78" rx="12"/></g>
    <g font-size="29" font-weight="700"><text x="305" y="195">今の道具</text><text x="815" y="195">新しい道具</text></g>
    <text x="560" y="168" font-size="23" fill="#555">替える</text>
    <text x="560" y="279" font-size="25">選んだ理由と前提は、次の見直しへ残す</text>
  </g>
</svg>
